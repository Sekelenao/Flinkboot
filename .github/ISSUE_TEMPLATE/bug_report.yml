name: "Bug Report"
description: Report a reproducible defect in Flinkboot
title: "[Bug]: "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please provide as much context as possible to help us reproduce and resolve the problem quickly.

  - type: checkboxes
    id: checklist
    attributes:
      label: Search & Verification
      description: Please check the following before submitting.
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true

  - type: input
    id: flinkboot-version
    attributes:
      label: Flinkboot Version
      placeholder: "e.g. 0.4.0-1.20"
    validations:
      required: true

  - type: input
    id: flink-version
    attributes:
      label: Apache Flink Version
      placeholder: "e.g. 1.20.5"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java / JDK Version
      placeholder: "e.g. 17.0.10, Temurin 21, Corretto 11"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description & Steps to Reproduce
      placeholder: A clear and concise description of the bug and how to reproduce it.
    validations:
      required: true

  - type: textarea
    id: config-yaml
    attributes:
      label: Minimal YAML Configuration
      description: The YAML configuration snippet used when the issue occurs.
      render: yaml

  - type: textarea
    id: java-code
    attributes:
      label: Minimal Java Code Snippet
      description: The minimal Java code snippet (job main or properties definition).
      render: java

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Stacktrace
      description: Please copy and paste any relevant logs or exception stacktraces.
      render: shell

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      options:
        - label: I would like to submit a Pull Request to fix this issue.
