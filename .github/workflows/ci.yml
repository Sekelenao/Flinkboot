name: Build, Quality & Metrics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**/src/**'
      - '**/pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      test: ${{ steps.filter.outputs.test }}
      kafka: ${{ steps.filter.outputs.kafka }}
      fluss: ${{ steps.filter.outputs.fluss }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/src/**'
              - '**/pom.xml'
              - '.github/workflows/**'
            core:
              - 'flinkboot-core/src/**'
              - 'flinkboot-core/pom.xml'
            test:
              - 'flinkboot-test/src/**'
              - 'flinkboot-test/pom.xml'
            kafka:
              - 'flinkboot-kafka/src/**'
              - 'flinkboot-kafka/pom.xml'
            fluss:
              - 'flinkboot-fluss/src/**'
              - 'flinkboot-fluss/pom.xml'
            root:
              - 'pom.xml'
              - '.github/workflows/**'

  test:
    name: Build, Test & Quality
    needs: changes
    if: always() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Verify code formatting (Spotless)
        run: mvn -B spotless:check

      - name: Build with Maven
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE_CHANGED: ${{ needs.changes.outputs.core }}
          ROOT_CHANGED: ${{ needs.changes.outputs.root }}
          TEST_CHANGED: ${{ needs.changes.outputs.test }}
          KAFKA_CHANGED: ${{ needs.changes.outputs.kafka }}
          FLUSS_CHANGED: ${{ needs.changes.outputs.fluss }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$CORE_CHANGED" = "true" ] || [ "$ROOT_CHANGED" = "true" ]; then
            echo "Running full repository verification"
            mvn -B verify -T 1C --file pom.xml
          else
            MODULES=""
            if [ "$TEST_CHANGED" = "true" ]; then
              MODULES="${MODULES:+$MODULES,}flinkboot-test"
            fi
            if [ "$KAFKA_CHANGED" = "true" ]; then
              MODULES="${MODULES:+$MODULES,}flinkboot-kafka"
            fi
            if [ "$FLUSS_CHANGED" = "true" ]; then
              MODULES="${MODULES:+$MODULES,}flinkboot-fluss"
            fi

            if [ -z "$MODULES" ]; then
              echo "No specific leaf module matched; running full repository verification"
              mvn -B verify -T 1C --file pom.xml
            else
              echo "Running targeted verification for: $MODULES"
              mvn -B install -pl .,flinkboot-core -Dmaven.test.skip=true -Djacoco.skip=true --file pom.xml
              mvn -B verify -pl "$MODULES" -T 1C --file pom.xml
            fi
          fi

      - name: Upload Surefire Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Extract test count and create badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: test-count
        run: |
          TEST_COUNT=$(find . -path "*/target/surefire-reports/*.xml" -exec grep -h '<testcase' {} + | wc -l)
          echo "count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "Total tests: $TEST_COUNT"
          mkdir -p .github/badges
          curl -s "https://img.shields.io/badge/Test%20count-$TEST_COUNT-blue.svg?logo=junit5&color=25A162" -o .github/badges/tests.svg

      - name: Generate JaCoCo Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: '**/target/site/jacoco/jacoco.csv'
          coverage-label: 'Coverage'
          branches-label: 'Branches'
          colors: '#25A162 #25A162 #dfb317 #fe7d37 #e05d44'
          intervals: '100 80 70 60 0'

      - name: Log coverage percentage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Checkout badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges-repo

      - name: Copy badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp .github/badges/jacoco.svg badges-repo/Coverage.svg
          cp .github/badges/branches.svg badges-repo/Branches.svg
          cp .github/badges/tests.svg badges-repo/Tests.svg
          cd badges-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --staged --quiet || git commit -m "Update badges"
          git push
