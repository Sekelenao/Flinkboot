name: Update Contributors

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/badges/**'
  workflow_dispatch:

concurrency:
  group: update-contributors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contributors:
    name: Update Contributors Showcase
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Update README Contributors
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/update_contributors.py

      - name: Commit and Push Changes
        run: |
          git config user.name "flinkboot-ci-bot[bot]"
          git config user.email "flinkboot-ci-bot[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs(readme): update contributors showcase ranked by merged pull requests"
            git pull --rebase origin main
            git push
          fi
